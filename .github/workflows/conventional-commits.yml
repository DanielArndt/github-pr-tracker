name: Conventional Commits

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

permissions: {}

jobs:
  validate-pr-title:
    name: Validate PR Title
    runs-on: ubuntu-24.04
    steps:
      - name: Validate conventional commit title
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          LC_ALL: C
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^()]+\))?!?: (.+)$'
          if [[ "$PR_TITLE" == *$'\n'* || "$PR_TITLE" == *$'\r'* || ! "$PR_TITLE" =~ $pattern ]]; then
            printf '%s\n' '::error::PR title must use type(scope): subject or type: subject, with an optional ! for breaking changes.'
            exit 1
          fi
          subject="${BASH_REMATCH[3]}"
          if [[ "$subject" == [A-Z]* || "$subject" == *. ]]; then
            printf '%s\n' '::error::PR title subject must not start with an uppercase letter or end with a period.'
            exit 1
          fi
